name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      OPENJOC_SOURCE_PIN: ${{ vars.OPENJOC_SOURCE_PIN || 'a7c82ef01ab507977134f96b7a7b627118d342cc' }}
    steps:
      - name: Check out tagged Browser source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install locked npm dependencies
        run: npm ci

      - name: Validate tag and source policy
        shell: pwsh
        run: |
          if (-not $env:OPENJOC_SOURCE_PIN) {
            throw 'An exact compatible OpenJOC source commit is required before publishing a Browser release.'
          }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          npm run check:version -- $version
          npm run check:release-policy
          npm run check:secrets
          npm run check:license

      - name: Check pinned OpenJOC WASM source
        run: npm run check:wasm

      - name: Type-check and test
        run: |
          npm run check
          npm test

      - name: Build WASM and extension from source
        run: |
          npm run build
          $info = Get-Content extension/wasm/openjoc-build-info.json | ConvertFrom-Json
          if ($info.sourceDirty -ne $false -or $info.sourceCommit -ne $env:OPENJOC_SOURCE_PIN) {
            throw 'Release WASM source is not the pinned clean OpenJOC checkout.'
          }

      - name: Check the packaged content script bundle
        run: npm run test:bundle

      - name: Run lifecycle integration tests
        run: npm run test:lifecycle

      - name: Run parity gates
        run: |
          npm run parity
          npm run cmaf-parity

      - name: Package and validate release artifact
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          npm run package:release -- --version $version
          npm run validate:release -- --version $version

      - name: Prepare release notes from the changelog
        id: release-notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $heading = "^## \[$([regex]::Escape($version))\](?:\s|$)"
          $lines = [IO.File]::ReadAllLines('CHANGELOG.md')
          $start = -1
          for ($index = 0; $index -lt $lines.Length; $index++) {
            if ($lines[$index] -match $heading) { $start = $index; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version." }
          $end = $lines.Length
          for ($index = $start + 1; $index -lt $lines.Length; $index++) {
            if ($lines[$index] -match '^##\s+\[') { $end = $index; break }
          }
          if ($end -le $start + 1) { throw "CHANGELOG.md section for $version is empty." }
          $notes = ($lines[$start..($end - 1)] -join "`n") + "`n"
          $notesPath = Join-Path $env:RUNNER_TEMP 'openjoc-browser-release-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: ${{ steps.release-notes.outputs.notes_path }}
          files: |
            release/OpenJOC-Browser-${{ github.ref_name }}-chromium-standard.zip
            release/OpenJOC-Browser-${{ github.ref_name }}-chromium-standard.zip.sha256
