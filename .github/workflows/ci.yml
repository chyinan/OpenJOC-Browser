name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out Browser source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Select the reviewed OpenJOC release
        shell: pwsh
        run: |
          $source = Get-Content scripts/openjoc-source.json | ConvertFrom-Json
          "OPENJOC_SOURCE_PIN=$($source.commit)" >> $env:GITHUB_ENV
          "OPENJOC_SOURCE_REF=v$($source.version)" >> $env:GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install locked npm dependencies
        run: npm ci

      - name: Check release policy
        run: npm run check:release-policy

      - name: Scan tracked files for secrets
        run: npm run check:secrets

      - name: Check license and notices
        run: npm run check:license

      - name: Read package version
        id: package-version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check version consistency
        run: npm run check:version -- ${{ steps.package-version.outputs.version }}

      - name: Check OpenJOC WASM source
        run: npm run check:wasm

      - name: Type-check application
        run: npm run check

      - name: Run functional-core tests
        run: npm test

      - name: Build production extension
        run: npm run build

      - name: Check the packaged content script bundle
        run: npm run test:bundle

      - name: Run lifecycle integration tests
        run: npm run test:lifecycle

      - name: Run stereo and binaural parity with both dialnorm modes
        run: npm run check:parity

      - name: Package release artifact
        run: npm run package:release -- --version ${{ steps.package-version.outputs.version }}

      - name: Validate release artifact
        run: npm run validate:release -- --version ${{ steps.package-version.outputs.version }}

      - name: Upload validated release candidate
        uses: actions/upload-artifact@v7
        with:
          name: OpenJOC-Browser-v${{ steps.package-version.outputs.version }}-chromium-standard
          path: |
            release/OpenJOC-Browser-v${{ steps.package-version.outputs.version }}-chromium-standard.zip
            release/OpenJOC-Browser-v${{ steps.package-version.outputs.version }}-chromium-standard.zip.sha256
          if-no-files-found: error
          retention-days: 7
